  <circle cx="100" cy="100" r="100" fill="#0a0a0a"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Main 404 Design - Center -->
  <g transform="translate(100, 100)">
    <!-- Left "4" -->
    <text x="-36" y="22" font-family="'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-5">4</text>
    
